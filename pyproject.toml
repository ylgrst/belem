[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "belem"
authors = [
    {name = "Yasmin LEGERSTEE", email = 'yasmin.legerstee@u-bordeaux.fr'},
    ]
description = "Architectured materials homogenization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["microstructure", "lattice", "FEM", "homogenization"]
classifiers = [
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: MacOS',
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    ]
dependencies = [
    "numpy>=2.0",
    "pyvista",
    "scipy",
    "matplotlib",
    "gmsh",
    "mmg",
    "meshio",
    "pytest",
    "pytest-cov",
    "pandas",
    "scikit-learn>=1.4",
    "pylatex",
    "tqdm",
    ]
dynamic = ["version"]

[project.optional-dependencies]
all = [
    'pardiso4py',
    'pytest',
    'pytest-cov',
    'pytest',
    'pytest-mypy',
    'pytest-pylint',
    'pytest-cov',
    'pytest-watch',
    'pylint',
    'black',
    'mypy',
    'hypothesis',
    'h5py',
    'ipython',
    'jupyter',
    'mypy',
    'meshio',
    'scipy',
    'simcoon>=2.0.1,<3',
    'pandas',
    'microgen>=1.3.2,<2',
    'fedoo>=1.0.0,<2',
    ]
test = [
    'pytest',
    'pytest-cov',
    'pytest',
    'pytest-mypy',
    'pytest-pylint',
    'pytest-cov',
    'pytest-watch',
    'pylint',
    'black',
    'mypy',
    'hypothesis',
    'h5py',
    ]

dev = [
    'ipython',
    'jupyter',
    'mypy',
    'meshio',
    'scipy',
    'microgen>=1.3.2,<2',
    'fedoo>=1.0.0,<2',
    'simcoon>=2.0.1,<3',
    ]


[project.urls]
"Bug Tracker" = 'https://github.com/ylgrst/belem/issues'
"Source Code" = 'https://github.com/ylgrst/belem'

[tool.setuptools.dynamic]
version = {attr = 'belem._version.__version__'}

[tool.setuptools.packages.find]
include = [
    'belem',
    'belem.*',
    ]

[tool.setuptools.package-data]
"belem.data" = [
    'offset_densities.json',
    ]

[tool.mypy]
follow_imports = 'silent'
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_any_explicit = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = "test"

[[tool.mypy.overrides]]
module = [
    "cadquery",
    "elana",
    "fedoo.*",
    "fedoo",
    "hypothesis.strategies",
    "hypothesis",
    "laspy",
    "matplotlib.pyplot",
    "matplotlib",
    "microgen",
    "networkx",
    "pylatex",
    "pyvista",
    "scipy.*",
    "scipy",
    "shapely.geometry",
    "simcoon.*",
    "simcoon",
    "sklearn.*",
    "tqdm",
    ]
ignore_missing_imports = true

[tool.black]
line-length = 80
